name: Build and verify Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify core application services
        run: dotnet run --project tests/FlashVsr.Tests -c Release
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify complete-frame geometry
        run: python -m unittest discover -s tests -v
      - name: Build self-contained installer
        shell: powershell
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FlashVSR-Desktop-Windows
          path: |
            artifacts/FlashVSR-Desktop-Setup-*.exe
            artifacts/FlashVSR-Desktop-Setup-*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes artifacts/FlashVSR-Desktop-Setup-*.exe artifacts/FlashVSR-Desktop-Setup-*.sha256
